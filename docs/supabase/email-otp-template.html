<!--
  Brief — Supabase OTP email template (Magic Link template slot)

  Apply in Supabase Dashboard:
  1. Auth → Email Templates → Magic Link
  2. Paste the HTML body below (between <!DOCTYPE html> and closing </html>)
  3. Auth → Providers → Email → Email OTP Expiration → 600 seconds (10 min)
  4. Auth → URL Configuration → Site URL = https://brief.hanif.one

  OTP-only: includes {{ .Token }}, does NOT include {{ .ConfirmationURL }}.
  See docs/supabase/auth-session-settings.md for session time-box settings.
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Your Brief sign-in code</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #fafafa;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      color: #171717;
      -webkit-font-smoothing: antialiased;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background-color: #fafafa; padding: 40px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 420px;
              background-color: #ffffff;
              border: 1px solid #e5e5e5;
              border-radius: 16px;
              overflow: hidden;
            "
          >
            <tr>
              <td style="padding: 32px 32px 24px; text-align: center">
                <img
                  src="https://brief.hanif.one/icons/icon-full.png"
                  alt="Brief"
                  width="56"
                  height="56"
                  style="display: block; margin: 0 auto 20px; border-radius: 12px"
                />
                <p
                  style="
                    margin: 0 0 4px;
                    font-size: 11px;
                    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                      Consolas, monospace;
                    letter-spacing: 0.22em;
                    text-transform: uppercase;
                    color: #737373;
                  "
                >
                  brief.hanif.one
                </p>
                <h1
                  style="
                    margin: 0 0 8px;
                    font-size: 22px;
                    font-weight: 600;
                    letter-spacing: -0.02em;
                    color: #171717;
                  "
                >
                  Your sign-in code
                </h1>
                <p
                  style="
                    margin: 0;
                    font-size: 14px;
                    line-height: 1.5;
                    color: #737373;
                  "
                >
                  Enter this code on the Brief sign-in page to continue.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 32px 24px; text-align: center">
                <div
                  style="
                    display: inline-block;
                    padding: 16px 28px;
                    border: 1px solid #d4d4d4;
                    border-radius: 12px;
                    background-color: #fafafa;
                    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                      Consolas, monospace;
                    font-size: 32px;
                    font-weight: 600;
                    letter-spacing: 0.35em;
                    color: #171717;
                  "
                >
                  {{ .Token }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 32px 32px; text-align: center">
                <p
                  style="
                    margin: 0 0 8px;
                    font-size: 13px;
                    line-height: 1.5;
                    color: #737373;
                  "
                >
                  This code expires in <strong style="color: #171717">10 minutes</strong>.
                </p>
                <p
                  style="
                    margin: 0;
                    font-size: 12px;
                    line-height: 1.5;
                    color: #a3a3a3;
                  "
                >
                  If you didn&apos;t request this, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
          <p
            style="
              margin: 24px 0 0;
              font-size: 11px;
              font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                monospace;
              letter-spacing: 0.18em;
              text-transform: uppercase;
              color: #a3a3a3;
            "
          >
            Brief — Your daily operational briefing
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
